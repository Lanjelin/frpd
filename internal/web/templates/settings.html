{{define "settings"}}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>frpd</title><meta name="theme-color" content="#477EE5"><script src="{{asset "theme.js"}}"></script><link rel="stylesheet" href="{{asset "styles.css"}}"><script defer src="{{asset "app.js"}}"></script><link rel="icon" href="{{asset "frpd.svg"}}" type="image/svg+xml"><link rel="icon" href="{{asset "favicon-32.png"}}" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="{{asset "apple-touch-icon.png"}}"><link rel="manifest" href="{{asset "site.webmanifest"}}"></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="/"><img class="brand-icon" src="{{asset "frpd.svg"}}" width="28" height="28" alt="">frpd</a><div class="topbar-actions"><a class="button tiny secondary" href="/" data-i18n="dashboard">Dashboard</a></div></div></header>
<main class="page"><section class="panel form-panel settings-panel"><div class="panel-head"><div><h1 data-i18n="settings">Settings</h1></div></div>
  <div class="kv-list">
    <div class="kv-row"><label for="theme" data-i18n="theme">Theme</label><select id="theme"><option value="default" data-i18n="default">Default</option><option value="alucard" data-i18n="alucard">Alucard</option><option value="dracula" data-i18n="dracula">Dracula</option><option value="catppuccin-latte" data-i18n="latte">Catppuccin Latte</option><option value="catppuccin-frappe" data-i18n="frappe">Catppuccin Frappé</option><option value="catppuccin-macchiato" data-i18n="macchiato">Catppuccin Macchiato</option><option value="catppuccin-mocha" data-i18n="mocha">Catppuccin Mocha</option><option value="gruvbox" data-i18n="gruvbox">Gruvbox</option><option value="solarized-light" data-i18n="solarizedLight">Solarized Light</option><option value="solarized-dark" data-i18n="solarizedDark">Solarized Dark</option><option value="nord" data-i18n="nord">Nord</option><option value="tokyo-night" data-i18n="tokyoNight">Tokyo Night</option><option value="light" data-i18n="light">Light</option><option value="soft-dawn" data-i18n="softDawn">Soft Dawn</option></select></div>
    <div class="kv-row"><label for="language" data-i18n="language">Language</label><select id="language"><option value="en" data-i18n="english">English</option><option value="no" data-i18n="norwegian">Norwegian</option><option value="de" data-i18n="german">German</option></select></div>
    <div class="kv-row toggle-row"><div><label for="hide-vhost-ports" data-i18n="hideVhostPorts" data-i18n-title="hideVhostPortsHelp" title="Hide HTTP and HTTPS virtual-host ports in displayed remote addresses.">Hide vhost ports</label></div><input id="hide-vhost-ports" type="checkbox"></div>
    <div class="kv-row"><label for="vhost-ports" data-i18n="vhostPorts">Vhost ports</label><input id="vhost-ports" inputmode="numeric" placeholder="80, 443" value="{{.VhostPorts}}"></div>
    <div class="kv-row toggle-row"><div><label for="remote-links" data-i18n="remoteLinks" data-i18n-title="remoteLinksHelp" title="Open HTTP and HTTPS proxy remotes in a new tab.">Make web remotes clickable</label></div><input id="remote-links" type="checkbox"></div>
    <div class="kv-row toggle-row"><div><label for="show-frps-clients" data-i18n="showFrpsClients">Show unmatched FRPS clients</label></div><input id="show-frps-clients" type="checkbox"></div>
    <div class="kv-row toggle-row"><div><label for="hide-offline-frps-proxies" data-i18n="hideOfflineFrpsProxies">Hide offline FRPS clients and proxies</label></div><input id="hide-offline-frps-proxies" type="checkbox"></div>
  </div>
  <div class="settings-group"><h2 data-i18n="displayColumns">Proxy list columns</h2>
    <div class="settings-options column-options" data-column-options>
      <div class="column-option" data-column-option="name"><button type="button" class="column-drag-handle" data-column-drag-handle aria-label="Drag Name to reorder">⠿</button><label><input type="checkbox" data-column-toggle="name"> <span data-i18n="showName">Name</span></label><div class="column-move"><button type="button" data-column-move="up" aria-label="Move Name up">↑</button><button type="button" data-column-move="down" aria-label="Move Name down">↓</button></div></div>
      <div class="column-option" data-column-option="state"><button type="button" class="column-drag-handle" data-column-drag-handle aria-label="Drag State to reorder">⠿</button><label><input type="checkbox" data-column-toggle="state"> <span data-i18n="showState">State</span></label><div class="column-move"><button type="button" data-column-move="up" aria-label="Move State up">↑</button><button type="button" data-column-move="down" aria-label="Move State down">↓</button></div></div>
      <div class="column-option" data-column-option="type"><button type="button" class="column-drag-handle" data-column-drag-handle aria-label="Drag Type to reorder">⠿</button><label><input type="checkbox" data-column-toggle="type"> <span data-i18n="showType">Type</span></label><div class="column-move"><button type="button" data-column-move="up" aria-label="Move Type up">↑</button><button type="button" data-column-move="down" aria-label="Move Type down">↓</button></div></div>
      <div class="column-option" data-column-option="local"><button type="button" class="column-drag-handle" data-column-drag-handle aria-label="Drag Local to reorder">⠿</button><label><input type="checkbox" data-column-toggle="local"> <span data-i18n="showLocal">Local</span></label><div class="column-move"><button type="button" data-column-move="up" aria-label="Move Local up">↑</button><button type="button" data-column-move="down" aria-label="Move Local down">↓</button></div></div>
      <div class="column-option" data-column-option="remote"><button type="button" class="column-drag-handle" data-column-drag-handle aria-label="Drag Remote to reorder">⠿</button><label><input type="checkbox" data-column-toggle="remote"> <span data-i18n="showRemote">Remote</span></label><div class="column-move"><button type="button" data-column-move="up" aria-label="Move Remote up">↑</button><button type="button" data-column-move="down" aria-label="Move Remote down">↓</button></div></div>
      <div class="column-option" data-column-option="traffic"><button type="button" class="column-drag-handle" data-column-drag-handle aria-label="Drag Today traffic to reorder">⠿</button><label><input type="checkbox" data-column-toggle="traffic"> <span>Today traffic</span></label><div class="column-move"><button type="button" data-column-move="up" aria-label="Move Today traffic up">↑</button><button type="button" data-column-move="down" aria-label="Move Today traffic down">↓</button></div></div>
      <div class="column-option" data-column-option="connections"><button type="button" class="column-drag-handle" data-column-drag-handle aria-label="Drag Connections to reorder">⠿</button><label><input type="checkbox" data-column-toggle="connections"> <span>Connections</span></label><div class="column-move"><button type="button" data-column-move="up" aria-label="Move Connections up">↑</button><button type="button" data-column-move="down" aria-label="Move Connections down">↓</button></div></div>
      <div class="column-option" data-column-option="actions"><button type="button" class="column-drag-handle" data-column-drag-handle aria-label="Drag Actions to reorder">⠿</button><label><input type="checkbox" data-column-toggle="actions"> <span data-i18n="actions">Actions</span></label><div class="column-move"><button type="button" data-column-move="up" aria-label="Move Actions up">↑</button><button type="button" data-column-move="down" aria-label="Move Actions down">↓</button></div></div>
    </div>
  </div>
</section></main></body></html>
{{end}}
